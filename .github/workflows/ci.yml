name: ML service checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the checked main commit to the organization GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ml-${{ github.event_name == 'workflow_dispatch' && inputs.publish_image && format('publish-{0}', github.sha) || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ci-placeholder-no-inference
      ML_IMAGE: intersim-ml:ci
      ML_NETWORK_NAME: intersim-ml-ci
      COMPOSE_PROJECT_NAME: intersim-ml-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install audio test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
          python -m app.contracts --check
          python -m pytest
          python -m pip check
      - name: Validate Compose
        run: |
          docker compose config --quiet
          INTERSIM_NETWORK=intersim-ml-ci docker compose -f compose.yaml -f compose.intersim.yaml config --quiet
      - name: Build production image
        run: docker compose build --pull ml-service
      - name: Start production container
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Check HTTP contracts without inference
        run: python scripts/smoke.py
      - name: Check Docker DNS from a peer container
        run: >-
          docker run --rm --network intersim-ml-ci intersim-ml:ci
          python -c "import urllib.request; assert b'ready' in urllib.request.urlopen('http://ml-service:8001/health/ready', timeout=5).read()"
      - name: Check runtime user and filesystem
        run: |
          docker compose exec -T ml-service python -c "import os; from pathlib import Path; assert os.getuid() == 1000; assert not Path('/app/.env').exists(); assert not Path('/app/tests').exists()"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q ml-service)")" = true
      - name: Check generation catalog and private persistent state
        run: >-
          docker compose exec -T ml-service python -c
          "import os,stat; from pathlib import Path;
          from app.question_generation.contracts import GenerationRequest;
          from app.question_generation.service import context_materials;
          assert context_materials(GenerationRequest(area='sql',grade='Middle'));
          p=Path('/var/lib/intersim/question-generation');
          assert p.stat().st_uid == 1000 and stat.S_IMODE(p.stat().st_mode) == 448;
          f=p/'.ci-volume-probe'; f.write_text('private'); f.unlink()"
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 ml-service
      - name: Stop test containers
        if: always()
        run: docker compose down --remove-orphans --volumes

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_image &&
      github.repository == 'intersim-org/intersim-ml' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish the versioned image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/intersim-org/intersim-ml:${GITHUB_SHA:0:12}"
          git archive "$GITHUB_SHA" | docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" -
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$image"
          digest_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          docker manifest inspect "$digest_ref" >/dev/null
          printf 'Image: `%s`\n\nDigest: `%s`\n' "$image" "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
